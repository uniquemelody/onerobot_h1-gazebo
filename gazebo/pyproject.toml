[project]
name = "onerobotics-a1-gazebo"
version = "0.1.0"
description = "Gazebo tooling for the public OneRobotics A1 assets"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "runtime: starts the real isolated Gazebo Harmonic simulator",
  "render_runtime: starts a real isolated Gazebo Harmonic Ogre2 render",
]
